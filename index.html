<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TRYOUT×LOVE 문자 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#f2ede6;
  --cream2:#e8e1d8;
  --cream3:#faf7f3;
  --navy:#1a2356;
  --navy2:#242f6a;
  --pink:#e8336a;
  --pink2:#ff5580;
  --pink-soft:#fce8ef;
  --white:#fff;
  --text:#1a2356;
  --muted:#8a8fa8;
  --border-navy:rgba(26,35,86,0.15);
  --border-pink:rgba(232,51,106,0.25);
  --gold:#c8860a;
  --gold-bg:#fff8e8;
  --gold-border:rgba(200,134,10,0.25);
}
body{
  background:var(--cream);
  font-family:'Noto Sans KR',sans-serif;
  color:var(--text);
  min-height:100vh;
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:rgba(232,51,106,0.3);border-radius:2px;}

/* ── SCREEN SWITCH ── */
.screen{display:none;}
.screen.active{display:flex;flex-direction:column;}

/* ════════════ LOGIN ════════════ */
#login{
  align-items:center;justify-content:center;
  min-height:100vh;padding:2.5rem 1rem;
  background:var(--cream);
  background-image:
    radial-gradient(circle at 15% 20%, rgba(232,51,106,0.06) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(26,35,86,0.06) 0%, transparent 40%);
}

/* deco marks */
#login::before{
  content:'× × ×';
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:8px;
  color:rgba(232,51,106,0.3);pointer-events:none;
}

.logo-block{text-align:center;margin-bottom:30px;}
.logo-tag{
  display:inline-block;
  font-size:10px;letter-spacing:3px;color:var(--navy);
  background:var(--white);border:1px solid var(--border-navy);
  border-radius:20px;padding:4px 14px;margin-bottom:12px;
}
.logo-tag em{color:var(--pink);font-style:normal;font-weight:700;}
.logo-main{
  font-family:'Bebas Neue',sans-serif;font-size:72px;
  letter-spacing:3px;line-height:1;color:var(--navy);
}
.logo-main .hp{color:var(--pink);}
.logo-xlove{
  font-family:'Bebas Neue',sans-serif;font-size:20px;
  color:var(--pink);letter-spacing:5px;margin-top:2px;
}

/* login card */
.login-card{
  background:var(--white);
  border:1.5px solid var(--border-navy);
  border-radius:18px;
  padding:28px 28px 24px;
  width:320px;
  box-shadow:0 4px 24px rgba(26,35,86,0.08), 0 1px 4px rgba(26,35,86,0.05);
}
.id-label{
  font-size:10px;letter-spacing:3px;color:var(--muted);
  margin-bottom:8px;text-transform:uppercase;text-align:center;
}
.id-display{
  width:100%;min-height:48px;
  background:var(--cream3);
  border:1.5px solid var(--border-navy);
  border-radius:10px;
  padding:12px 16px;font-size:17px;
  color:var(--navy);text-align:center;
  margin-bottom:16px;word-break:break-all;
  line-height:1.4;transition:border-color 0.2s;
  font-weight:500;
}
.id-display.has-text{border-color:var(--pink);background:var(--pink-soft);}
.id-display.empty{color:var(--muted);font-size:13px;font-weight:400;}

.pw-input{
  width:100%;padding:13px 16px;
  background:var(--cream3);border:1.5px solid var(--border-navy);
  border-radius:10px;font-size:16px;color:var(--navy);
  outline:none;font-family:'Noto Sans KR',sans-serif;font-weight:500;
  transition:border-color 0.2s;margin-bottom:12px;
}
.pw-input:focus{border-color:var(--pink);background:var(--white);}
.pw-input::placeholder{color:var(--muted);}
.login-btn{
  width:100%;padding:13px;
  background:var(--pink);border:none;border-radius:10px;
  color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  transition:background 0.15s;
}
.login-btn:hover{background:var(--pink2);}

.login-error{font-size:11px;color:var(--pink);margin-top:10px;min-height:16px;text-align:center;font-weight:500;}

/* ════════════ TOP BAR ════════════ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  height:54px;padding:0 22px;
  background:var(--white);
  border-bottom:1.5px solid var(--border-navy);
  flex-shrink:0;
}
.bar-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--navy);}
.bar-logo .hp{color:var(--pink);}
.bar-logo .xl{font-size:14px;color:var(--muted);margin-left:4px;}
.bar-right{display:flex;align-items:center;gap:10px;}
.avatar{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;border:2px solid var(--border-pink);
  background:var(--pink-soft);color:var(--pink);
}
.avatar.admin{background:var(--gold-bg);color:var(--gold);border-color:var(--gold-border);}
.bar-name{font-size:13px;font-weight:700;color:var(--navy);}
.admin-badge{
  font-size:10px;background:var(--gold-bg);color:var(--gold);
  border:1px solid var(--gold-border);border-radius:4px;padding:2px 8px;letter-spacing:1px;font-weight:700;
}
.logout-btn{
  font-size:11px;color:var(--muted);cursor:pointer;
  padding:5px 12px;border-radius:6px;
  border:1px solid var(--border-navy);background:transparent;
  transition:all 0.15s;font-family:'Noto Sans KR',sans-serif;font-weight:500;
}
.logout-btn:hover{color:var(--pink);border-color:var(--border-pink);}

/* ════════════ LAYOUT ════════════ */
.body-layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 54px);}

/* ════════════ SIDEBAR ════════════ */
.sidebar{
  width:215px;flex-shrink:0;
  background:var(--white);
  border-right:1.5px solid var(--border-navy);
  overflow-y:auto;display:flex;flex-direction:column;
}
.sb-header{
  padding:12px 16px;font-size:10px;letter-spacing:3px;
  color:var(--muted);border-bottom:1px solid var(--border-navy);
  flex-shrink:0;text-transform:uppercase;font-weight:700;
}
.cast-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;cursor:pointer;
  border-bottom:1px solid rgba(26,35,86,0.06);
  transition:background 0.15s;
}
.cast-item:hover{background:var(--pink-soft);}
.cast-item.active{
  background:var(--pink-soft);
  border-left:3px solid var(--pink);
}
.c-av{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;
  border:2px solid transparent;
}
.c-info{flex:1;min-width:0;}
.c-name{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-id{font-size:10px;color:var(--muted);}
.unread{
  background:var(--pink);color:#fff;
  font-size:10px;border-radius:10px;padding:2px 7px;font-weight:700;flex-shrink:0;
}

/* ════════════ SIDEBAR TABS ════════════ */
.sb-tabs{display:flex;border-bottom:1px solid var(--border-navy);flex-shrink:0;}
.sb-tab{
  flex:1;padding:10px 0;font-size:11px;font-weight:700;
  text-align:center;cursor:pointer;color:var(--muted);
  border-bottom:2px solid transparent;transition:all 0.15s;
  letter-spacing:1px;
}
.sb-tab:hover{color:var(--navy);}
.sb-tab.active{color:var(--pink);border-bottom-color:var(--pink);}

/* 받은 문자함 */
.inbox-item{
  padding:13px 14px;border-bottom:1px solid rgba(26,35,86,0.06);
  cursor:pointer;transition:background 0.15s;
}
.inbox-item:hover{background:var(--pink-soft);}
.inbox-item.active{background:var(--pink-soft);border-left:3px solid var(--pink);}
.inbox-from{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:3px;}
.inbox-preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inbox-time{font-size:10px;color:var(--muted);margin-top:2px;}
.inbox-unread-dot{
  width:8px;height:8px;border-radius:50%;background:var(--pink);
  flex-shrink:0;margin-left:auto;
}

/* ════════════ CHAT ════════════ */
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--cream);}
.chat-header{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;
  border-bottom:1.5px solid var(--border-navy);
  background:var(--white);flex-shrink:0;
}
.chat-header .ch-name{font-size:14px;font-weight:700;color:var(--navy);}
.chat-header .ch-id{font-size:10px;color:var(--muted);}

.messages{
  flex:1;overflow-y:auto;padding:18px;
  display:flex;flex-direction:column;gap:10px;
  background:var(--cream);
  background-image:
    radial-gradient(rgba(26,35,86,0.025) 1px, transparent 1px);
  background-size:22px 22px;
}
.msg-row{display:flex;flex-direction:column;}
.msg-row.mine{align-items:flex-end;}
.msg-row.theirs{align-items:flex-start;}
.msg-sender{font-size:10px;color:var(--muted);margin-bottom:3px;padding:0 4px;font-weight:500;}
.bubble{
  max-width:68%;padding:10px 14px;
  border-radius:16px;font-size:13px;line-height:1.55;word-break:break-word;
}
.mine .bubble{
  background:var(--pink);color:#fff;
  border-bottom-right-radius:3px;
}
.theirs .bubble{
  background:var(--white);color:var(--navy);
  border:1.5px solid var(--border-navy);
  border-bottom-left-radius:3px;
}
.msg-time{font-size:10px;color:var(--muted);margin-top:3px;padding:0 4px;}

.input-bar{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;
  border-top:1.5px solid var(--border-navy);
  background:var(--white);flex-shrink:0;
}
.chat-input{
  flex:1;background:var(--cream3);
  border:1.5px solid var(--border-navy);
  border-radius:22px;padding:10px 18px;
  color:var(--navy);font-size:13px;outline:none;
  font-family:'Noto Sans KR',sans-serif;transition:border-color 0.2s;
}
.chat-input:focus{border-color:var(--pink);background:var(--white);}
.chat-input::placeholder{color:var(--muted);}
.send-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--pink);border:none;color:#fff;cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s;flex-shrink:0;
}
.send-btn:hover{transform:scale(1.08);background:var(--pink2);}
.empty-chat{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;flex-direction:column;gap:10px;
}
.empty-chat .big{
  font-family:'Bebas Neue',sans-serif;font-size:40px;
  color:rgba(232,51,106,0.18);letter-spacing:4px;
}

/* ════════════ ADMIN ════════════ */
#admin{height:100vh;overflow:hidden;}
#admin .topbar{background:var(--gold-bg);border-bottom-color:var(--gold-border);position:sticky;top:0;z-index:10;flex-shrink:0;}
.admin-sb{
  width:215px;flex-shrink:0;
  background:var(--white);
  border-right:1.5px solid var(--gold-border);
  overflow-y:auto;
}
.a-sb-header{
  padding:12px 16px;font-size:10px;letter-spacing:3px;
  color:var(--muted);border-bottom:1px solid var(--gold-border);
  text-transform:uppercase;font-weight:700;
}
.a-cast-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;cursor:pointer;
  border-bottom:1px solid rgba(26,35,86,0.05);transition:background 0.15s;
}
.a-cast-item:hover{background:var(--gold-bg);}
.a-cast-item.active{background:var(--gold-bg);border-left:3px solid var(--gold);}
.admin-content{
  flex:1;overflow-y:auto;
  background:var(--cream);
  display:flex;flex-direction:column;
}
.a-card{
  background:var(--white);border:1.5px solid var(--border-navy);
  border-radius:14px;padding:22px;margin-bottom:16px;
}
.a-card h3{
  font-size:10px;letter-spacing:2px;color:var(--muted);
  margin-bottom:16px;text-transform:uppercase;font-weight:700;
}
.field{margin-bottom:13px;}
.field label{
  font-size:10px;color:var(--muted);display:block;
  margin-bottom:5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;
}
.field input{
  width:100%;background:var(--cream3);
  border:1.5px solid var(--border-navy);border-radius:8px;
  padding:10px 12px;color:var(--navy);font-size:13px;
  outline:none;font-family:'Noto Sans KR',sans-serif;transition:border-color 0.2s;font-weight:500;
}
.field input:focus{border-color:var(--pink);background:var(--white);}
.btn-row{display:flex;gap:8px;margin-top:8px;}
.a-save-btn{
  background:var(--navy);border:none;color:#fff;
  font-size:13px;font-weight:700;padding:10px 22px;
  border-radius:8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
  transition:background 0.15s;
}
.a-save-btn:hover{background:var(--navy2);}
.a-del-btn{
  background:transparent;border:1.5px solid var(--border-pink);
  color:var(--pink);font-size:12px;padding:10px 16px;
  border-radius:8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:500;
}
.a-del-btn:hover{background:var(--pink-soft);}
.a-add-btn{
  width:calc(100% - 28px);margin:12px 14px;
  background:transparent;border:1.5px dashed var(--border-navy);
  color:var(--navy);font-size:12px;padding:10px;border-radius:8px;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s;font-weight:500;
}
.a-add-btn:hover{background:var(--cream2);border-color:var(--navy);}
.chat-log-item{
  font-size:12px;color:var(--muted);padding:6px 0;
  border-bottom:1px solid rgba(26,35,86,0.06);
}
.chat-log-item span{color:var(--navy);font-weight:500;}
.no-content{color:var(--muted);font-size:12px;padding:8px 0;}
.day-btn{
  width:32px;height:32px;border-radius:8px;border:1.5px solid var(--gold-border);
  background:transparent;color:var(--muted);font-size:13px;font-weight:700;
  cursor:pointer;transition:all 0.15s;font-family:'Noto Sans KR',sans-serif;
}
.day-btn:hover{border-color:var(--gold);color:var(--gold);}
.day-btn.active-day{background:var(--gold);border-color:var(--gold);color:#1a1008;}

.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--navy);color:#fff;
  font-size:12px;font-weight:700;padding:10px 20px;
  border-radius:8px;display:none;z-index:999;
  font-family:'Noto Sans KR',sans-serif;
  box-shadow:0 4px 16px rgba(26,35,86,0.2);
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div class="screen active" id="login">
  <div class="logo-block">
    <div class="logo-tag">너와의 <em>첫 매치</em>를 시작합니다</div>
    <div class="logo-main">TRY<span class="hp">♥</span>UT</div>
    <div class="logo-xlove">×LOVE</div>
  </div>

  <div class="login-card">
    <div class="id-label">× PLAYER ID ×</div>
    <input type="text" id="pw-input" class="pw-input" placeholder="아이디를 입력하세요" autocomplete="off"  onkeydown="if(event.key==='Enter')tryLogin()" oninput="document.getElementById('login-error').textContent=''"/>
    <button class="login-btn" onclick="tryLogin()">로그인 →</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ═══════════ MAIN ═══════════ -->
<div class="screen" id="main">
  <div class="topbar">
    <div class="bar-logo">TRY<span class="hp">♥</span>UT<span class="xl">×LOVE</span></div>
    <div class="bar-right">
      <div class="avatar" id="main-av">?</div>
      <span class="bar-name" id="main-name">-</span>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <div class="body-layout">
    <div class="sidebar">
      <div class="sb-tabs">
        <div class="sb-tab active" id="tab-players" onclick="switchTab('players')">문자 보내기</div>
        <div class="sb-tab" id="tab-inbox" onclick="switchTab('inbox')">받은 문자함 <span id="inbox-unread-badge" style="display:none;background:var(--pink);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;font-weight:700;margin-left:3px;"></span></div>
      </div>
      <div id="cast-list"></div>
      <div id="inbox-list" style="display:none"></div>
    </div>
    <div class="chat-wrap" id="chat-wrap">
      <div class="empty-chat">
        <div class="big">× LOVE ×</div>
        <div>플레이어를 선택하세요</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ ADMIN ═══════════ -->
<div class="screen" id="admin">
  <div class="topbar">
    <div class="bar-logo" style="color:var(--gold)">⚙ MATCH DIRECTOR</div>
    <div class="bar-right">
      <div class="avatar admin">👑</div>
      <span class="bar-name" id="admin-name">-</span>
      <span class="admin-badge">ADMIN</span>
      <span id="day-badge" style="font-size:12px;font-weight:700;color:var(--pink);background:var(--pink-soft);border:1px solid var(--border-pink);border-radius:6px;padding:3px 10px;">DAY 1</span>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <div class="body-layout">
    <div class="admin-sb">
      <div onclick="openAdminInbox()" id="admin-inbox-btn"
        style="display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;border-bottom:1.5px solid var(--gold-border);background:var(--gold-bg);transition:background 0.15s;">
        <span style="font-size:18px">💬</span>
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--gold);">전체 채팅</div>
          <div style="font-size:10px;color:var(--muted);">출연자 메시지 모아보기</div>
        </div>
      </div>
      <div class="a-sb-header">× DAY 설정 ×</div>
      <div style="padding:12px 14px;border-bottom:1px solid var(--gold-border)">
        <div style="font-size:10px;color:var(--muted);margin-bottom:8px;letter-spacing:1px;">현재 진행 Day</div>
        <div style="display:flex;flex-direction:column;gap:5px;">
          <button onclick="setDay('첫인상')" id="day-btn-첫인상" class="day-btn active-day" style="width:100%;font-size:12px;">첫인상</button>
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            <button onclick="setDay('1일차')" id="day-btn-1일차" class="day-btn" style="font-size:11px;">1일차</button>
            <button onclick="setDay('2일차')" id="day-btn-2일차" class="day-btn" style="font-size:11px;">2일차</button>
            <button onclick="setDay('3일차')" id="day-btn-3일차" class="day-btn" style="font-size:11px;">3일차</button>
            <button onclick="setDay('4일차')" id="day-btn-4일차" class="day-btn" style="font-size:11px;">4일차</button>
            <button onclick="setDay('5일차')" id="day-btn-5일차" class="day-btn" style="font-size:11px;">5일차</button>
          </div>
          <button onclick="setDay('D-day')" id="day-btn-D-day" class="day-btn" style="width:100%;font-size:12px;">D-day</button>
        </div>
      </div>
      <div class="a-sb-header" style="margin-top:0">× 일자별 문자 ×</div>
      <div id="day-log-list"></div>
      <div class="a-sb-header" style="margin-top:0">× 관리자 문자 ×</div>
      <div style="padding:12px 14px;border-bottom:1px solid var(--gold-border)">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12px;color:var(--navy);font-weight:500;">출연자 문자 허용</span>
          <div id="admin-chat-toggle" onclick="toggleAdminChat()" style="width:44px;height:24px;border-radius:12px;background:var(--cream2);border:1.5px solid var(--border-navy);cursor:pointer;position:relative;transition:all 0.2s;">
            <div id="admin-chat-knob" style="width:18px;height:18px;border-radius:50%;background:var(--muted);position:absolute;top:2px;left:2px;transition:all 0.2s;"></div>
          </div>
        </div>
        <div id="admin-chat-status" style="font-size:10px;color:var(--muted);margin-top:6px;">현재: 꺼짐</div>
      </div>
      <div class="a-sb-header" style="margin-top:0">× 출연자 관리 ×</div>
      <div id="a-cast-list"></div>
      <button class="a-add-btn" onclick="addCast()">+ 출연자 추가</button>
    </div>
    <div class="admin-content" id="admin-content">
      <div style="color:var(--muted);font-size:13px;padding-top:60px;text-align:center;line-height:2">
        출연자를 선택하거나<br>새로운 출연자를 추가하세요
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓ 저장되었습니다</div>

<script>
const ADMIN_ID='김보경';
let S={
  me:null, isAdmin:false, selCast:null,
  currentDay:'첫인상',
  viewDay:'첫인상',
  sentByDay:{},
  adminChatEnabled:false,
  adminMsgs:{},
  secretMsgs:{},  // 첫인상·D-day 문자 — 관리자만 볼 수 있음 {fromId: [{to,text,time,ts,day}]}
  uniformForms:{}, // 첫인상 유니폼 폼 {castId: {color, info}}
  cast:(function(){
    try{
      const saved=localStorage.getItem('tryout_cast');
      return saved?JSON.parse(saved):[
        {id:'이수민', name:'이수민', color:'#e8336a'},
        {id:'박지호', name:'박지호', color:'#1a2356'},
        {id:'김태연', name:'김태연', color:'#1d9e75'},
        {id:'정우성', name:'정우성', color:'#c8860a'},
      ];
    }catch(e){
      return [
        {id:'이수민', name:'이수민', color:'#e8336a'},
        {id:'박지호', name:'박지호', color:'#1a2356'},
        {id:'김태연', name:'김태연', color:'#1d9e75'},
        {id:'정우성', name:'정우성', color:'#c8860a'},
      ];
    }
  })(),
  msgs:{}
};

const DAYS=['첫인상','1일차','2일차','3일차','4일차','5일차','D-day'];
const SECRET_DAYS=['첫인상','D-day']; // 관리자만 볼 수 있는 날

const NICKNAMES=['🐣 병아리','🐰 토끼','🦊 여우','🐻 곰돌이','🐼 판다','🦁 사자',
  '🐸 개구리','🐧 펭귄','🦄 유니콘','🐬 돌고래','🌸 벚꽃','🍀 클로버',
  '🌙 달빛','⭐ 별빛','🌈 무지개','🍭 사탕','🎀 리본','🪄 마법사'];
function randNick(){
  return NICKNAMES[Math.floor(Math.random()*NICKNAMES.length)];
}

function ck(a,b){ return [a,b].sort().join('__'); }
function gt(){
  const d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── 로그인 ── */
function tryLogin(){
  const id=document.getElementById('pw-input').value.trim();
  if(!id){ document.getElementById('login-error').textContent='아이디를 입력하세요.'; return; }
  if(id===ADMIN_ID){ S.me=ADMIN_ID; S.isAdmin=true; showAdmin(); return; }
  const cast=S.cast.find(c=>c.id===id);
  if(cast){ S.me=cast.id; S.isAdmin=false; S.selCast=null; showMain(cast); return; }
  document.getElementById('login-error').textContent='존재하지 않는 아이디입니다.';
  document.getElementById('pw-input').value='';
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function logout(){
  const inp=document.getElementById('pw-input');
  if(inp) inp.value='';
  S.me=null; S.isAdmin=false; S.selCast=null;
  document.getElementById('login-error').textContent='';
  showScreen('login');
}

/* ── 메인 ── */
function showMain(userCast){
  showScreen('main');
  document.getElementById('main-name').textContent=userCast.name;
  setTimeout(function(){ updateInboxBadge(userCast); },50);
  const av=document.getElementById('main-av');
  av.textContent=userCast.name[0];
  av.style.background=userCast.color+'22';
  av.style.color=userCast.color;
  av.style.borderColor=userCast.color+'55';
  renderCastList(userCast);
}

function updateInboxBadge(me){
  if(!me) return;
  let count=0;
  S.cast.filter(function(c){ return c.id!==me.id; }).forEach(function(c){
    const key=ck(me.id,c.id);
    count+=(S.msgs[key]||[]).filter(function(m){ return m.from!==me.id&&!m.read; }).length;
  });
  const badge=document.getElementById('inbox-unread-badge');
  if(!badge) return;
  if(count>0){ badge.textContent=count; badge.style.display='inline'; }
  else { badge.style.display='none'; }
}

function switchTab(tab){
  const me=S.cast.find(c=>c.id===S.me);
  document.getElementById('tab-players').classList.toggle('active', tab==='players');
  document.getElementById('tab-inbox').classList.toggle('active', tab==='inbox');
  const meObj=S.cast.find(function(c){ return c.id===S.me; });
  updateInboxBadge(meObj);
  document.getElementById('cast-list').style.display=tab==='players'?'':'none';
  document.getElementById('inbox-list').style.display=tab==='inbox'?'':'none';
  if(tab==='inbox'){
    openInbox(me);
  } else {
    if(S.selCast){
      const target=S.cast.find(c=>c.id===S.selCast);
      if(target) openChat(me,target);
    } else {
      const wrap=document.getElementById('chat-wrap');
      wrap.innerHTML='';
      const empty=document.createElement('div');
      empty.className='empty-chat';
      empty.innerHTML='<div class="big">× LOVE ×</div><div>플레이어를 선택하세요</div>';
      wrap.appendChild(empty);
    }
  }
}

function renderCastList(me){
  const list=document.getElementById('cast-list');
  list.innerHTML='';

  // 관리자 항목 — 항상 표시, OFF면 클릭 불가 + 잠금 안내
  {
    const div=document.createElement('div');
    div.className='cast-item'+(S.selCast==='__ADMIN__'?' active':'');
    div.onclick=function(){ S.selCast='__ADMIN__'; renderCastList(me); openAdminChat(me); };
    div.style.opacity='1';
    div.style.cursor='pointer';
    const av=document.createElement('div');
    av.className='c-av';
    av.style.cssText='background:rgba(200,134,10,0.12);color:var(--gold);border-color:rgba(200,134,10,0.4)';
    av.textContent='👑';
    const info=document.createElement('div');
    info.className='c-info';
    const adminUnread=(S.adminMsgs[me.id]||[]).filter(m=>m.from==='__ADMIN__'&&!m.read).length;
    info.innerHTML='<div class="c-name">관리자</div><div class="c-id">MATCH DIRECTOR</div>';
    div.appendChild(av);
    div.appendChild(info);
    if(adminUnread && S.adminChatEnabled){
      const u=document.createElement('div');
      u.className='unread';
      u.textContent=adminUnread;
      div.appendChild(u);
    }
    list.appendChild(div);
  }

  S.cast.filter(c=>c.id!==me.id).forEach(c=>{
    const div=document.createElement('div');
    div.className='cast-item'+(S.selCast===c.id?' active':'');
    div.onclick=function(){ S.selCast=c.id; renderCastList(me); openChat(me,c); };
    const av=document.createElement('div');
    av.className='c-av';
    av.style.cssText='background:'+c.color+'18;color:'+c.color+';border-color:'+c.color+'44';
    av.textContent=c.name[0];
    const info=document.createElement('div');
    info.className='c-info';
    info.innerHTML='<div class="c-name">'+c.name+'</div><div class="c-id">'+c.id+'</div>';
    div.appendChild(av);
    div.appendChild(info);
    list.appendChild(div);
  });
}

/* ── 받은 문자함 ── */
function openInbox(me){
  S.selCast=null;
  renderCastList(me);

  // 수신 메시지 수집 (day 포함)
  let allReceived=[];
  S.cast.filter(c=>c.id!==me.id).forEach(c=>{
    const key=ck(me.id,c.id);
    (S.msgs[key]||[]).filter(m=>m.from===c.id).forEach(m=>{
      allReceived.push({text:m.text, time:m.time, ts:m.ts||0, senderId:c.id, nick:m.nick, day:m.day||1});
    });
  });
  allReceived.sort(function(a,b){ return a.ts-b.ts; });

  // 읽음 처리
  S.cast.filter(c=>c.id!==me.id).forEach(c=>{
    const key=ck(me.id,c.id);
    (S.msgs[key]||[]).forEach(m=>{ if(m.from!==me.id) m.read=true; });
  });
  updateInboxBadge(me);

  const wrap=document.getElementById('chat-wrap');
  wrap.innerHTML='';

  const hd=document.createElement('div');
  hd.className='chat-header';
  hd.innerHTML='<div style="font-size:20px">💌</div><div><div class="ch-name">받은 문자함</div><div class="ch-id">익명으로 표시됩니다</div></div>';
  wrap.appendChild(hd);

  const msgs=document.createElement('div');
  msgs.className='messages';
  msgs.id='inbox-msgs';
  wrap.appendChild(msgs);

  if(allReceived.length===0){
    const empty=document.createElement('div');
    empty.style.cssText='text-align:center;color:var(--muted);font-size:13px;padding-top:40px';
    empty.textContent='아직 받은 문자가 없습니다 💌';
    msgs.appendChild(empty);
    return;
  }

  // Day별로 그룹화해서 렌더링
  let lastDay=null;
  allReceived.forEach(function(m){
    // Day 구분선
    if(m.day !== lastDay){
      lastDay=m.day;
      const divider=document.createElement('div');
      divider.style.cssText='display:flex;align-items:center;gap:10px;padding:8px 0;';
      divider.innerHTML='<div style="flex:1;height:1px;background:var(--border-navy);"></div>'
        +'<div style="font-size:11px;font-weight:700;color:var(--navy);background:var(--cream2);border:1px solid var(--border-navy);border-radius:12px;padding:3px 12px;white-space:nowrap;">'+m.day+'</div>'
        +'<div style="flex:1;height:1px;background:var(--border-navy);"></div>';
      msgs.appendChild(divider);
    }

    const nick=m.nick||randNick();
    const row=document.createElement('div');
    row.className='msg-row theirs';
    const sender=document.createElement('div');
    sender.className='msg-sender';
    sender.textContent=nick;
    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.textContent=m.text;
    const time=document.createElement('div');
    time.className='msg-time';
    time.textContent=m.time;
    row.appendChild(sender);
    row.appendChild(bubble);
    row.appendChild(time);
    msgs.appendChild(row);
  });
  msgs.scrollTop=msgs.scrollHeight;
}

/* ── 채팅 ── */
function openSecretMsgForm(me, target){
  const wrap=document.getElementById('chat-wrap');
  wrap.innerHTML='';
  const alreadySent=hasSentToday(me.id);
  const icon=S.currentDay==='첫인상'?'👀':'💘';

  const hd=document.createElement('div');
  hd.className='chat-header';
  hd.innerHTML='<div style="font-size:22px">'+icon+'</div>'
    +'<div><div class="ch-name">'+S.currentDay+' 문자</div>'
    +'<div class="ch-id">관리자에게만 전달됩니다</div></div>';
  wrap.appendChild(hd);

  const body=document.createElement('div');
  body.style.cssText='flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--cream);';
  wrap.appendChild(body);

  // 첫인상 전용: 유니폼 폼
  if(S.currentDay==='첫인상'){
    const formCard=document.createElement('div');
    formCard.style.cssText='background:var(--white);border:1.5px solid var(--border-navy);border-radius:14px;padding:18px;';
    formCard.innerHTML='<div style="font-size:12px;font-weight:700;color:var(--navy);letter-spacing:1px;margin-bottom:14px;">🎽 유니폼 정보</div>';
    const saved=S.uniformForms[me.id]||{};

    const q1wrap=document.createElement('div');
    q1wrap.style.cssText='margin-bottom:12px;';
    q1wrap.innerHTML='<div style="font-size:13px;color:var(--navy);margin-bottom:6px;">❓ 자신이 생각하는 가장 잘 어울리는 색은?</div>';
    const inp1=document.createElement('input');
    inp1.type='text'; inp1.id='uniform-color'; inp1.value=saved.color||'';
    inp1.disabled=alreadySent;
    inp1.placeholder='#FF0000';
    inp1.maxLength=7;
    inp1.style.cssText='width:100%;padding:9px 12px;background:var(--cream3);border:1.5px solid var(--border-navy);border-radius:8px;font-size:14px;color:var(--navy);outline:none;font-family:monospace;letter-spacing:1px;';
    inp1.addEventListener('input',function(){
      let v=inp1.value;
      if(v&&!v.startsWith('#')) inp1.value='#'+v;
    });
    q1wrap.appendChild(inp1);
    formCard.appendChild(q1wrap);

    const q2wrap=document.createElement('div');
    q2wrap.innerHTML='<div style="font-size:13px;color:var(--navy);margin-bottom:6px;">📋 유니폼 스타일 및 추가 정보</div>';
    const inp2=document.createElement('textarea');
    inp2.id='uniform-info'; inp2.value=saved.info||'';
    inp2.placeholder='등번호, 별명, 원하는 스타일을 자유롭게 적어주세요. 실제 경기에서 착용하는 것을 토대로 적어주셔도 좋습니다.';
    inp2.disabled=alreadySent;
    inp2.style.cssText='width:100%;padding:9px 12px;background:var(--cream3);border:1.5px solid var(--border-navy);border-radius:8px;font-size:13px;color:var(--navy);outline:none;font-family:inherit;resize:none;height:80px;';
    q2wrap.appendChild(inp2);
    formCard.appendChild(q2wrap);

    if(!alreadySent){
      const saveBtn=document.createElement('button');
      saveBtn.textContent='저장'; saveBtn.style.cssText='margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;';
      saveBtn.onclick=function(){
        if(!S.uniformForms[me.id]) S.uniformForms[me.id]={};
        S.uniformForms[me.id].color=inp1.value.trim();
        S.uniformForms[me.id].info=inp2.value.trim();
        saveBtn.textContent='✓ 저장됨'; saveBtn.style.background='var(--pink)';
        setTimeout(function(){ saveBtn.textContent='저장'; saveBtn.style.background='var(--navy)'; },1500);
      };
      formCard.appendChild(saveBtn);
    } else {
      const note=document.createElement('div');
      note.style.cssText='font-size:11px;color:var(--muted);margin-top:8px;';
      note.textContent='✓ 제출 완료';
      formCard.appendChild(note);
    }
    body.appendChild(formCard);
  }

  // 첫인상: 상대 선택 카드 / D-day: 상대+문장 카드
  const msgCard=document.createElement('div');
  msgCard.style.cssText='background:var(--white);border:1.5px solid var(--border-navy);border-radius:14px;padding:18px;';
  const cardTitle=S.currentDay==='첫인상'?'👀 첫인상 선택':'💌 D-day 문자';
  msgCard.innerHTML='<div style="font-size:12px;font-weight:700;color:var(--navy);letter-spacing:1px;margin-bottom:14px;">'+cardTitle+'</div>';

  const toLabel=document.createElement('div');
  toLabel.style.cssText='font-size:12px;color:var(--muted);margin-bottom:6px;';
  toLabel.textContent='상대';
  msgCard.appendChild(toLabel);

  const myMsg=(S.secretMsgs[me.id]||[]).find(function(m){ return m.day===S.currentDay; });

  const toSel=document.createElement('select');
  toSel.id='secret-to'; toSel.disabled=alreadySent;
  toSel.style.cssText='width:100%;padding:9px 12px;background:var(--cream3);border:1.5px solid var(--border-navy);border-radius:8px;font-size:13px;color:var(--navy);outline:none;font-family:inherit;margin-bottom:12px;';
  const defOpt=document.createElement('option');
  defOpt.value=''; defOpt.textContent='선택하세요';
  toSel.appendChild(defOpt);
  S.cast.filter(function(c){ return c.id!==me.id; }).forEach(function(c){
    const opt=document.createElement('option');
    opt.value=c.id; opt.textContent=c.name;
    if(myMsg && c.id===myMsg.to) opt.selected=true;
    else if(!myMsg && c.id===target.id) opt.selected=true;
    toSel.appendChild(opt);
  });
  msgCard.appendChild(toSel);

  // D-day만 문장 입력
  if(S.currentDay==='D-day'){
    const txtLabel=document.createElement('div');
    txtLabel.style.cssText='font-size:12px;color:var(--muted);margin-bottom:6px;';
    txtLabel.textContent='문장';
    msgCard.appendChild(txtLabel);
    const txtInp=document.createElement('textarea');
    txtInp.id='secret-msg'; txtInp.disabled=alreadySent;
    txtInp.placeholder='전하고 싶은 말을 적어주세요...';
    txtInp.style.cssText='width:100%;padding:9px 12px;background:var(--cream3);border:1.5px solid var(--border-navy);border-radius:8px;font-size:13px;color:var(--navy);outline:none;font-family:inherit;resize:none;height:90px;margin-bottom:12px;';
    if(myMsg) txtInp.value=myMsg.text||'';
    msgCard.appendChild(txtInp);
  }

  if(!alreadySent){
    const sendBtn=document.createElement('button');
    sendBtn.textContent=S.currentDay==='첫인상'?'선택 완료':'전송';
    sendBtn.style.cssText='width:100%;background:var(--pink);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;';
    sendBtn.onclick=function(){ sendSecretMsg(me, target); };
    msgCard.appendChild(sendBtn);
    if(S.currentDay!=='첫인상'){
      const notice=document.createElement('div');
      notice.style.cssText='font-size:11px;color:#bbb;text-align:center;margin-top:8px;';
      notice.textContent='전송하시겠습니까? 한 번 보낸 문자는 되돌릴 수 없습니다.';
      msgCard.appendChild(notice);
    }
  } else {
    const toName=myMsg?(S.cast.find(function(c){return c.id===myMsg.to;})||{name:myMsg.to}).name:'';
    const sentNote=document.createElement('div');
    sentNote.style.cssText='font-size:12px;color:var(--muted);text-align:center;padding:10px;background:var(--cream3);border-radius:8px;';
    sentNote.textContent=S.currentDay==='첫인상'?('✓ '+toName+' 선택 완료'):('✓ '+toName+'에게 D-day 문자를 보냈습니다');
    msgCard.appendChild(sentNote);
  }
  body.appendChild(msgCard);
}

function sendSecretMsg(me, target){
  const toSel=document.getElementById('secret-to');
  if(!toSel||!toSel.value){ alert('상대를 선택하세요.'); return; }
  let text='';
  if(S.currentDay!=='첫인상'){
    const txtInp=document.getElementById('secret-msg');
    if(!txtInp||!txtInp.value.trim()){ alert('문장을 입력하세요.'); return; }
    text=txtInp.value.trim();
  }
  if(!S.secretMsgs[me.id]) S.secretMsgs[me.id]=[];
  S.secretMsgs[me.id].push({to:toSel.value, text:text, time:gt(), ts:Date.now(), day:S.currentDay});
  if(!S.sentByDay[me.id]) S.sentByDay[me.id]={};
  S.sentByDay[me.id][S.currentDay]=true;
  const newTarget=S.cast.find(function(c){ return c.id===toSel.value; })||target;
  openSecretMsgForm(me, newTarget);
}

function openChat(me, target){
  if(isSecretDay()){ openSecretMsgForm(me, target); return; }
  const key=ck(me.id, target.id);
  if(!S.msgs[key]) S.msgs[key]=[];

  const wrap=document.getElementById('chat-wrap');
  wrap.innerHTML='';

  // 헤더
  const hd=document.createElement('div');
  hd.className='chat-header';
  const hdAv=document.createElement('div');
  hdAv.className='c-av';
  hdAv.style.cssText='background:'+target.color+'18;color:'+target.color+';border-color:'+target.color+'44;width:36px;height:36px;font-size:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid;flex-shrink:0';
  hdAv.textContent=target.name[0];
  const hdInfo=document.createElement('div');
  hdInfo.innerHTML='<div class="ch-name">'+target.name+'</div><div class="ch-id">'+target.id+'</div>';
  hd.appendChild(hdAv);
  hd.appendChild(hdInfo);
  wrap.appendChild(hd);

  // 메시지 영역
  const msgArea=document.createElement('div');
  msgArea.className='messages';
  msgArea.id='msg-list';
  wrap.appendChild(msgArea);

  // 입력바
  const bar=document.createElement('div');
  bar.className='input-bar';
  const inp=document.createElement('input');
  inp.className='chat-input';
  inp.id='chat-input';
  inp.placeholder='메시지를 입력하세요...';
  const btn=document.createElement('button');
  btn.className='send-btn';
  btn.id='send-btn';
  btn.textContent='➤';
  bar.appendChild(inp);
  bar.appendChild(btn);
  wrap.appendChild(bar);

  // 전송 후 안내
  const info=document.createElement('div');
  info.id='send-info';

function isSecretDay(){ return SECRET_DAYS.includes(S.currentDay); }

function hasSentToday(userId){
  return !!(S.sentByDay[userId] && S.sentByDay[userId][S.currentDay]);
}

function sendMsg(fromId, toId){
  const key=ck(fromId, toId);
  const input=document.getElementById('chat-input');
  if(!input||!input.value.trim()) return;
  if(hasSentToday(fromId)){ lockInput(); return; }
  if(!S.msgs[key]) S.msgs[key]=[];
  S.msgs[key].push({from:fromId, text:input.value.trim(), time:gt(), ts:Date.now(), read:false, nick:randNick(), day:S.currentDay});
  if(!S.sentByDay[fromId]) S.sentByDay[fromId]={};
  S.sentByDay[fromId][S.currentDay]=true;
  input.value='';
  renderMsgs(key, fromId);
  lockInput();
}

function lockInput(){
  const input=document.getElementById('chat-input');

  if(input){ input.disabled=true; input.placeholder='이미 문자를 보냈습니다'; }

  if(info){ info.style.display='block'; }
}

function getAllMsgsByDay(day){
  const result=[];
  const isSecret=SECRET_DAYS.includes(day);
  if(isSecret){
    // secretMsgs에서 수집
    S.cast.forEach(function(sender){
      (S.secretMsgs[sender.id]||[]).filter(function(m){ return m.day===day; }).forEach(function(m){
        const receiver=S.cast.find(function(c){ return c.id===m.to; });
        result.push({msg:{text:m.text,time:m.time,ts:m.ts,from:sender.id}, sender:sender, receiver:receiver||{name:m.to,color:'#aaa'}});
      });
    });
  } else {
    S.cast.forEach(function(sender){
      S.cast.filter(function(r){ return r.id!==sender.id; }).forEach(function(receiver){
        const key=ck(sender.id, receiver.id);
        (S.msgs[key]||[]).filter(function(m){ return m.from===sender.id && m.day===day; }).forEach(function(m){
          result.push({msg:m, sender:sender, receiver:receiver});
        });
      });
    });
  }
  result.sort(function(a,b){ return (a.msg.ts||0)-(b.msg.ts||0); });
  return result;
}

  // 헤더
  const hd=document.createElement('div');
  hd.style.cssText='padding:16px 20px;border-bottom:1.5px solid var(--gold-border);background:var(--gold-bg);display:flex;align-items:center;gap:10px;flex-shrink:0;';
  hd.innerHTML='<div style="font-size:20px;cursor:pointer;" onclick="openAdminInbox()" title="전체채팅으로">←</div>'
    +'<div style="font-size:20px">📅</div>'
    +'<div><div style="font-size:15px;font-weight:700;color:var(--gold)">DAY '+day+' 문자 내역</div>'
    +'<div style="font-size:11px;color:var(--muted)">누가 누구에게 보냈는지 표시됩니다</div></div>';
  main.appendChild(hd);

  // 메시지 영역
  const msgArea=document.createElement('div');
  msgArea.style.cssText='flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;';
  main.appendChild(msgArea);

  const allMsgs=getAllMsgsByDay(day);

  if(allMsgs.length===0){
    const empty=document.createElement('div');
    empty.style.cssText='text-align:center;color:var(--muted);font-size:13px;padding-top:60px;';
    empty.textContent='Day '+day+' 에 보낸 문자가 없습니다.';
    msgArea.appendChild(empty);
    return;
  }

  allMsgs.forEach(function(item){
    const row=document.createElement('div');
    row.style.cssText='background:var(--white);border:1.5px solid var(--border-navy);border-radius:12px;padding:14px 16px;';

    // 발신/수신 정보
    const meta=document.createElement('div');
    meta.style.cssText='display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:12px;';

    // 보낸 사람 칩
    const fromChip=document.createElement('span');
    fromChip.style.cssText='background:'+item.sender.color+'18;color:'+item.sender.color+';border:1.5px solid '+item.sender.color+'44;border-radius:20px;padding:3px 10px;font-weight:700;';
    fromChip.textContent=item.sender.name;

    const arrow=document.createElement('span');
    arrow.style.cssText='color:var(--muted);font-size:14px;';
    arrow.textContent='→';

    // 받는 사람 칩
    const toChip=document.createElement('span');
    toChip.style.cssText='background:'+item.receiver.color+'18;color:'+item.receiver.color+';border:1.5px solid '+item.receiver.color+'44;border-radius:20px;padding:3px 10px;font-weight:700;';
    toChip.textContent=item.receiver.name;

    const timeSpan=document.createElement('span');
    timeSpan.style.cssText='margin-left:auto;color:var(--muted);font-size:11px;';
    timeSpan.textContent=item.msg.time;

    meta.appendChild(fromChip);
    meta.appendChild(arrow);
    meta.appendChild(toChip);
    meta.appendChild(timeSpan);

    // 메시지 본문
    const bubble=document.createElement('div');
    bubble.style.cssText='background:var(--cream3);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--navy);line-height:1.6;';
    bubble.textContent=item.msg.text;

    row.appendChild(meta);
    row.appendChild(bubble);
    msgArea.appendChild(row);
  });
}

function renderAdminList(){
  const list=document.getElementById('a-cast-list');
  list.innerHTML='';
  S.cast.forEach(function(c,i){
    const div=document.createElement('div');
    div.className='a-cast-item'+(S.selCast===c.id?' active':'');
    div.onclick=function(){
      S.selCast=c.id; renderAdminList();
      openAdminEdit(c,i);
    };
    const av=document.createElement('div');
    av.className='c-av';
    av.style.cssText='background:'+c.color+'18;color:'+c.color+';border-color:'+c.color+'44;width:30px;height:30px;font-size:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid;flex-shrink:0';
    av.textContent=c.name[0];
    const info=document.createElement('div');
    info.className='c-info';
    info.innerHTML='<div class="c-name" style="font-size:13px">'+c.name+'</div><div class="c-id">'+c.id+'</div>';
    div.appendChild(av);
    div.appendChild(info);
    // 읽지 않은 메시지 뱃지
    const unreadAdmin=(S.adminMsgs[c.id]||[]).filter(function(m){ return m.from===c.id&&!m.read; }).length;
    if(unreadAdmin){
      const u=document.createElement('div');
      u.className='unread';
      u.textContent=unreadAdmin;
      div.appendChild(u);
    }
    list.appendChild(div);
  });
}

function openAdminEdit(c,i){
  const inboxBtn=document.getElementById('admin-inbox-btn');
  if(inboxBtn) inboxBtn.style.background='var(--gold-bg)';
  const main=document.getElementById('admin-content');
  // 유니폼 폼 데이터
  const uf=S.uniformForms[c.id]||{};
  const uniformHtml=uf.color||uf.info
    ?'<div class="a-card"><h3>🎽 유니폼 정보 ('+c.name+')</h3>'
      +'<div style="font-size:13px;color:var(--navy);margin-bottom:8px;"><b>어울리는 색:</b> '+(uf.color||'미입력')+'</div>'
      +'<div style="font-size:13px;color:var(--navy);"><b>추가 정보:</b> '+(uf.info||'미입력')+'</div></div>'
    :'';
  main.innerHTML='<div class="a-card"><h3>출연자 정보 수정</h3>'
    +'<div class="field"><label>이름</label><input id="f-name" value="'+esc(c.name)+'"/></div>'
    +'<div class="field"><label>아이디 (로그인 ID)</label><input id="f-id" value="'+esc(c.id)+'"/></div>'
    +'<div class="field"><label>컬러 (#HEX)</label><input id="f-color" value="'+c.color+'"/></div>'
    +'<div class="btn-row"><button class="a-save-btn" onclick="saveCast('+i+')">저장</button>'
    +'<button class="a-del-btn" onclick="delCast('+i+')">삭제</button></div></div>'
    +uniformHtml
    +'<div class="a-card"><h3>채팅 내역</h3>'+getChatLog(c)+'</div>';
}

function getChatLog(c){
  let html='';

  // 1. 일반 문자 (1일차~5일차)
  let hasAny=false;
  S.cast.filter(function(x){ return x.id!==c.id; }).forEach(function(o){
    const key=ck(c.id,o.id);
    const msgs=(S.msgs[key]||[]).filter(function(m){ return m.from===c.id; });
    if(!msgs.length) return;
    hasAny=true;
    html+='<div style="margin-bottom:10px">';
    html+='<div style="font-size:10px;color:var(--gold);font-weight:700;margin-bottom:5px">→ '+o.name+' ('+msgs.length+'건)</div>';
    msgs.forEach(function(m){
      html+='<div class="chat-log-item">['+m.time+'] ['+m.day+'] '+esc(m.text)+'</div>';
    });
    html+='</div>';
  });

  // 2. 비밀 문자 (첫인상·D-day)
  const secrets=(S.secretMsgs[c.id]||[]);
  if(secrets.length){
    hasAny=true;
    html+='<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-navy)">';
    html+='<div style="font-size:10px;color:var(--pink);font-weight:700;margin-bottom:5px">🔒 비밀 문자</div>';
    secrets.forEach(function(m){
      const toName=(S.cast.find(function(x){ return x.id===m.to; })||{name:m.to}).name;
      html+='<div class="chat-log-item">['+m.time+'] ['+m.day+'] → <span>'+toName+'</span>: '+esc(m.text)+'</div>';
    });
    html+='</div>';
  }

  // 3. 관리자 채팅
  const adminLog=(S.adminMsgs[c.id]||[]);
  if(adminLog.length){
    hasAny=true;
    html+='<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-navy)">';
    html+='<div style="font-size:10px;color:var(--gold);font-weight:700;margin-bottom:5px">👑 관리자 채팅</div>';
    adminLog.forEach(function(m){
      const who=m.from==='__ADMIN__'?'관리자':c.name;
      html+='<div class="chat-log-item">['+m.time+'] <span>'+who+'</span>: '+esc(m.text)+'</div>';
    });
    html+='</div>';
  }

  return hasAny?html:'<div class="no-content">채팅 내역 없음</div>';
}

function saveCast(i){
  const name=document.getElementById('f-name').value.trim();
  const id=document.getElementById('f-id').value.trim();
  const color=document.getElementById('f-color').value.trim();
  if(!name||!id){ alert('이름과 아이디를 입력하세요.'); return; }
  S.cast[i]={id:id, name:name, color:color};
  saveCastToStorage();
  S.selCast=id; renderAdminList(); openAdminEdit(S.cast[i],i);
  const t=document.getElementById('toast'); t.style.display='block';
  setTimeout(function(){ t.style.display='none'; },2000);
}

function delCast(i){
  if(!confirm('"'+S.cast[i].name+'" 출연자를 삭제하시겠습니까?')) return;
  S.cast.splice(i,1); S.selCast=null;
  saveCastToStorage();
  document.getElementById('admin-content').innerHTML='<div style="color:var(--muted);font-size:13px;padding-top:60px;text-align:center;line-height:2">출연자를 선택하거나<br>새로운 출연자를 추가하세요</div>';
  renderAdminList();
}

function addCast(){
  const colors=['#e8336a','#1a2356','#1d9e75','#c8860a','#9b3dcf','#e67e22'];
  const nc={id:'새출연자', name:'새 출연자', color:colors[S.cast.length%colors.length]};
  S.cast.push(nc); S.selCast=nc.id;
  saveCastToStorage();
  renderAdminList(); openAdminEdit(nc, S.cast.length-1);
}

function saveCastToStorage(){
  try{ localStorage.setItem('tryout_cast', JSON.stringify(S.cast)); }catch(e){}
}
</script>
</body>
</html>
